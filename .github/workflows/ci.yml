name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-bridge-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-bridge-plugin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Sandbox bundle has no ES2020+ syntax
        run: "! grep -nE '\\?\\.|\\?\\?' dist/code.js"

  bridge:
    name: Bridge (tests, jar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: mvn -B -f bridge/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-jar
          path: bridge/target/figma-mcp-bridge-*.jar
          retention-days: 7

  e2e:
    name: End-to-end (MCP stdio + WebSocket)
    runs-on: ubuntu-latest
    needs: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: bridge-jar
          path: bridge/target
      - run: node e2e/smoke.mjs
