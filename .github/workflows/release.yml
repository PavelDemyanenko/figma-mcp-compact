name: Release

# Push a tag like v0.1.1 (must match bridge/pom.xml and mcp-bridge-plugin/package.json):
#   git tag -a v0.1.1 -m "0.1.1" && git push origin v0.1.1
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  packages: write   # push the image to ghcr.io

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches project versions
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          POM=$(grep -A1 '<artifactId>figma-mcp-bridge</artifactId>' bridge/pom.xml | sed -n 's:.*<version>\(.*\)</version>.*:\1:p')
          PKG=$(node -p "require('./mcp-bridge-plugin/package.json').version")
          echo "tag=$TAG pom=$POM package.json=$PKG"
          if [ "$TAG" != "$POM" ] || [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match bridge/pom.xml ($POM) or package.json ($PKG)"; exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-bridge-plugin/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Plugin
        working-directory: mcp-bridge-plugin
        run: npm ci && npm run typecheck && npm test && npm run build

      - name: Bridge
        run: mvn -B -f bridge/pom.xml package

      - name: End-to-end
        run: node e2e/smoke.mjs

      - name: Package assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out/figma-mcp-compact-plugin
          cp mcp-bridge-plugin/manifest.json out/figma-mcp-compact-plugin/
          cp -r mcp-bridge-plugin/dist out/figma-mcp-compact-plugin/dist
          (cd out && zip -qr "figma-mcp-compact-plugin-$VERSION.zip" figma-mcp-compact-plugin)
          cp "bridge/target/figma-mcp-bridge-$VERSION.jar" out/
          (cd out && sha256sum "figma-mcp-compact-plugin-$VERSION.zip" "figma-mcp-bridge-$VERSION.jar" > SHA256SUMS)

      - uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: |
            out/*.zip
            out/*.jar
            out/SHA256SUMS
      - uses: actions/upload-artifact@v5
        with:
          name: bridge-target
          path: bridge/target/figma-mcp-bridge-*.jar

  image:
    name: Docker image (ghcr.io)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: bridge-target
          path: bridge/target
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: bridge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.build.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Figma MCP Compact bridge: MCP server (stdio) + WebSocket bridge for the Figma plugin
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.build.outputs.version }}

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [build, image]
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: out
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          cat > notes.md <<EOF
          ## Install

          **Figma plugin:** unzip \`figma-mcp-compact-plugin-$VERSION.zip\`, then in Figma Desktop: Plugins → Development → Import plugin from manifest… → \`figma-mcp-compact-plugin/manifest.json\`.

          **Bridge (Docker, no Java needed):**
          \`\`\`bash
          claude mcp add -s user figma-compact -- docker run -i --rm -p 127.0.0.1:3055:3055 $IMAGE:$VERSION
          \`\`\`

          **Bridge (Java 25):** download \`figma-mcp-bridge-$VERSION.jar\`:
          \`\`\`bash
          claude mcp add -s user figma-compact -- java -jar /ABS/PATH/figma-mcp-bridge-$VERSION.jar
          \`\`\`

          Checksums: \`SHA256SUMS\`.
          EOF
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "Figma MCP Compact $VERSION" --notes-file notes.md --verify-tag
