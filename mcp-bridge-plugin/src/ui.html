<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Figma MCP Compact</title>
    <style>
      :root {
        --bg: var(--figma-color-bg, #ffffff);
        --bg2: var(--figma-color-bg-secondary, #f5f5f5);
        --fg: var(--figma-color-text, #1e1e1e);
        --fg2: var(--figma-color-text-secondary, #6b6b6b);
        --border: var(--figma-color-border, #e6e6e6);
        --ok: var(--figma-color-icon-success, #14ae5c);
        --warn: var(--figma-color-icon-warning, #f5a623);
        --err: var(--figma-color-icon-danger, #f24822);
        --err-fg: var(--figma-color-text-danger, #dc3412);
        --brand: var(--figma-color-bg-brand, #0d99ff);
        --on-brand: var(--figma-color-text-onbrand, #ffffff);
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 11px/16px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 8px 0 12px;
        border-bottom: 1px solid var(--border);
        flex: none;
      }
      header h1 { flex: 1; margin: 0; font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--err); flex: none; }
      .dot[data-s='connected'] { background: var(--ok); }
      .dot[data-s='connecting'], .dot[data-s='retrying'] { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
      .dot[data-s='disconnected'] { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }
      .icon {
        width: 24px; height: 24px; border: 0; border-radius: 4px; background: transparent;
        color: var(--fg2); font-size: 13px; cursor: pointer; display: grid; place-items: center;
      }
      .icon:hover, .icon[aria-expanded='true'] { background: var(--bg2); color: var(--fg); }
      .icon:focus-visible, button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
      main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      body.collapsed main { display: none; }
      body.collapsed header { border-bottom: 0; }
      section { padding: 8px 12px; border-bottom: 1px solid var(--border); }
      .label { font-size: 9px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg2); margin-bottom: 4px; }
      .row { display: flex; align-items: center; gap: 8px; }
      .grow { flex: 1; min-width: 0; }
      .muted { color: var(--fg2); }
      .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      code, .mono { font-family: var(--mono); font-size: 10px; }
      button.btn {
        height: 24px; padding: 0 10px; border-radius: 5px; border: 1px solid var(--border);
        background: var(--bg); color: var(--fg); font: inherit; cursor: pointer; white-space: nowrap;
      }
      button.btn:hover { background: var(--bg2); }
      button.primary { background: var(--brand); color: var(--on-brand); border-color: transparent; }
      button.primary:hover { background: var(--brand); filter: brightness(1.08); }
      button.wide { width: 100%; }
      #settings[hidden] { display: none; }
      #settings input[type='text'] {
        width: 100%; height: 24px; padding: 0 6px; border: 1px solid var(--border); border-radius: 4px;
        background: var(--bg2); color: var(--fg2); font-family: var(--mono); font-size: 10px;
      }
      #settings label { display: flex; align-items: center; gap: 6px; margin-top: 6px; cursor: pointer; }
      #log-section { flex: 1; display: flex; flex-direction: column; min-height: 0; border-bottom: 0; }
      #log {
        flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 6px 8px; list-style: none;
        background: var(--bg2); border-radius: 4px; font-family: var(--mono); font-size: 10px; line-height: 15px;
      }
      #log li { white-space: pre-wrap; word-break: break-all; }
      #log .t { color: var(--fg2); }
      #log .err { color: var(--err-fg); }
      #log .ok { color: var(--ok); }
      #log:empty::before { content: attr(data-empty); color: var(--fg2); }
      #settings select {
        height: 24px; padding: 0 4px; border: 1px solid var(--border); border-radius: 4px;
        background: var(--bg); color: var(--fg); font: inherit;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" id="dot" data-s="disconnected" aria-hidden="true"></span>
      <h1 id="title">Figma MCP Compact</h1>
      <button class="icon" id="btn-settings" data-i18n-title="settings" data-i18n-aria="settings" aria-expanded="false" aria-controls="settings">⚙</button>
      <button class="icon" id="btn-collapse">▾</button>
    </header>
    <main>
      <section>
        <div class="label" data-i18n="connectionLabel"></div>
        <div class="row">
          <div class="grow">
            <div id="status-text" class="ellipsis" role="status" aria-live="polite"></div>
            <div id="status-sub" class="muted mono ellipsis"></div>
          </div>
          <button class="btn primary" id="btn-connect"></button>
        </div>
        <div id="settings" hidden>
          <div class="label" style="margin-top: 8px" data-i18n="settings"></div>
          <input type="text" id="url" readonly data-i18n-aria="bridgeAddress" />
          <label><input type="checkbox" id="auto-connect" /> <span data-i18n="autoConnect"></span></label>
          <label><span data-i18n="language"></span>
            <select id="lang">
              <option value="auto" data-i18n="langAuto"></option>
              <option value="en">English</option>
              <option value="ru">Русский</option>
            </select>
          </label>
          <button class="btn wide" id="btn-bench" style="margin-top: 8px" data-i18n="benchButton" data-i18n-title="benchTitle"></button>
        </div>
      </section>
      <section>
        <div class="label" data-i18n="selectionLabel"></div>
        <div id="selection" class="ellipsis" title=""></div>
      </section>
      <section>
        <div class="label" data-i18n="quickActions"></div>
        <button class="btn wide" id="btn-copy" data-i18n="copySlice"></button>
      </section>
      <section id="log-section">
        <div class="row label"><span class="grow" data-i18n="logLabel"></span><button class="icon" id="btn-clear" data-i18n-title="clearLog" data-i18n-aria="clearLog" style="width: 18px; height: 16px; font-size: 10px">✕</button></div>
        <ol id="log" aria-live="off"></ol>
      </section>
    </main>
    <script type="module" src="./ui.ts"></script>
  </body>
</html>
